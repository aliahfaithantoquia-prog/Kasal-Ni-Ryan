```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Lovey ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd1dc, #fff0f5);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.container {
  width: 92%;
  max-width: 430px;
  text-align: center;
}

.envelope {
  width: 280px;
  height: 180px;
  margin: 0 auto 25px;
  background: #ff6b91;
  border-radius: 12px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 15px 35px rgba(0,0,0,.18);
}

.flap {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 140px solid transparent;
  border-right: 140px solid transparent;
  border-top: 100px solid #ff91aa;
}

.heart {
  position: absolute;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 48px;
  z-index: 5;
}

.open {
  background: #ff4778;
  color: white;
  border: 0;
  border-radius: 30px;
  padding: 14px 30px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  display: none;
  background: white;
  padding: 35px 20px;
  border-radius: 25px;
  box-shadow: 0 15px 40px rgba(0,0,0,.15);
}

.message h1 {
  color: #ff4778;
  font-size: 30px;
  line-height: 1.3;
}

.buttons {
  margin-top: 25px;
}

button {
  border: 0;
  border-radius: 30px;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}

.yes {
  background: #35c759;
  color: white;
}

.no {
  background: #ff4d4d;
  color: white;
}

#answer {
  display: none;
  margin-top: 25px;
  color: #ff4778;
  font-size: 25px;
  font-weight: bold;
}

.reaction {
  position: fixed;
  font-size: 45px;
  pointer-events: none;
  animation: pop .9s ease-out forwards;
  z-index: 100;
}

@keyframes pop {
  0% {
    transform: scale(.3);
    opacity: 0;
  }

  30% {
    transform: scale(1.3);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div id="start">

    <div class="envelope" onclick="openMessage()">
      <div class="flap"></div>
      <div class="heart">❤️</div>
    </div>

    <h2>For you, Lovey ❤️</h2>

    <button class="open" onclick="openMessage()">
      Open ❤️
    </button>

  </div>


  <div class="message" id="message">

    <h1>WILL YOU MARRY ME LOVEY? 💍❤️</h1>

    <div class="buttons">

      <button class="yes" onclick="yesAnswer()">
        YES ❤️
      </button>

      <button class="no" id="noButton" onclick="moveNo()">
        NO ❌
      </button>

    </div>

    <div id="answer"></div>

  </div>

</div>


<script>

function openMessage() {

  document.getElementById("start").style.display = "none";

  document.getElementById("message").style.display = "block";

}


function yesAnswer() {

  const answer = document.getElementById("answer");

  answer.style.display = "block";

  answer.innerHTML = "THANK YOU LOVE LOVE ❤️🥰💍";

  // Hearts
  for (let i = 0; i < 35; i++) {

    const reaction = document.createElement("div");

    reaction.className = "reaction";
    reaction.innerHTML = "❤️";

    reaction.style.left =
      Math.random() * 100 + "vw";

    reaction.style.top =
      Math.random() * 100 + "vh";

    document.body.appendChild(reaction);

    setTimeout(() => {
      reaction.remove();
    }, 900);
  }
}


function moveNo() {

  const button = document.getElementById("noButton");

  const maxX =
    window.innerWidth - button.offsetWidth - 10;

  const maxY =
    window.innerHeight - button.offsetHeight - 10;

  const x =
    Math.max(5, Math.random() * maxX);

  const y =
    Math.max(5, Math.random() * maxY);

  button.style.position = "fixed";
  button.style.left = x + "px";
  button.style.top = y + "px";


  // Angry reactions
  for (let i = 0; i < 4; i++) {

    const angry = document.createElement("div");

    angry.className = "reaction";
    angry.innerHTML = "😡";

    angry.style.left =
      Math.random() * 90 + "vw";

    angry.style.top =
      Math.random() * 80 + "vh";

    document.body.appendChild(angry);

    setTimeout(() => {
      angry.remove();
    }, 900);
  }
}

</script>

</body>
</html>
